# Test configuration file for pytest
# This file configures pytest behavior for the Data Pipelines project

[tool:pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Minimum version
minversion = 6.0

# Add project root to Python path
pythonpath = .

# Output options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    -ra

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for component interaction
    slow: Tests that take a long time to run
    database: Tests that require database connection
    mock: Tests using mock objects
    performance: Performance and timing tests
    
# Ignore certain files/directories during collection
collect_ignore = [
    "setup.py",
    "build/",
    "dist/",
    "*.egg-info/",
]

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage configuration (if using pytest-cov)
[coverage:run]
source = Sales_ETL
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */.*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

show_missing = true
precision = 2

[coverage:html]
directory = tests/coverage_html_report